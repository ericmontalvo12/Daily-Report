<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Work Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f3f4f6; }
    .photo-preview img { object-fit: cover; width: 80px; height: 80px; border-radius: 8px; }
    #drop-zone.drag-over { border-color: #f59e0b; background: #fffbeb; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #fff6; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen py-8 px-4">

  <div class="max-w-xl mx-auto">

    <!-- Header -->
    <div class="bg-amber-500 rounded-t-2xl px-6 py-5">
      <h1 class="text-white text-2xl font-bold">Daily Work Report</h1>
      <p class="text-amber-100 text-sm mt-1">Fill out and submit at the end of your shift</p>
    </div>

    <!-- Form -->
    <form id="reportForm" class="bg-white rounded-b-2xl shadow-md px-6 py-6 space-y-5" novalidate>

      <!-- Worker Name -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">Your Name <span class="text-red-400">*</span></label>
        <input type="text" name="workerName" placeholder="e.g. John Smith"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 text-base focus:outline-none focus:ring-2 focus:ring-amber-400" required />
      </div>

      <!-- Job Site -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">Job Site / Project <span class="text-red-400">*</span></label>
        <input type="text" name="jobSite" placeholder="e.g. 123 Main St – Foundation"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 text-base focus:outline-none focus:ring-2 focus:ring-amber-400" required />
      </div>

      <!-- Date -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">Date <span class="text-red-400">*</span></label>
        <input type="date" name="reportDate" id="reportDate"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 text-base focus:outline-none focus:ring-2 focus:ring-amber-400" required />
      </div>

      <!-- Start / End Time -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">Start Time <span class="text-red-400">*</span></label>
          <input type="time" name="startTime" id="startTime"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 text-base focus:outline-none focus:ring-2 focus:ring-amber-400" required />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">End Time <span class="text-red-400">*</span></label>
          <input type="time" name="endTime" id="endTime"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 text-base focus:outline-none focus:ring-2 focus:ring-amber-400" required />
        </div>
      </div>

      <!-- Hours badge -->
      <div id="hoursBadge" class="hidden bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 text-amber-700 text-sm font-semibold"></div>

      <!-- Work Description -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">Work Performed <span class="text-red-400">*</span></label>
        <textarea name="description" rows="4" placeholder="Describe what was done today…"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 text-base focus:outline-none focus:ring-2 focus:ring-amber-400 resize-none" required></textarea>
      </div>

      <!-- Notes / Issues -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">Notes / Issues <span class="text-gray-400 font-normal">(optional)</span></label>
        <textarea name="notes" rows="2" placeholder="Any problems, delays, or things to flag…"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 text-base focus:outline-none focus:ring-2 focus:ring-amber-400 resize-none"></textarea>
      </div>

      <!-- Photo Upload -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Photos <span class="text-gray-400 font-normal">(optional, up to 10)</span></label>
        <div id="drop-zone"
          class="border-2 border-dashed border-gray-300 rounded-xl p-5 text-center cursor-pointer transition-colors"
          onclick="document.getElementById('photoInput').click()">
          <svg class="mx-auto mb-2 text-gray-400 w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M3 16l4-4a3 3 0 014.24 0L15 16m2-2l1-1a3 3 0 014.24 0L23 14M14 8a2 2 0 11-4 0 2 2 0 014 0zM3 20h18a1 1 0 001-1V5a1 1 0 00-1-1H3a1 1 0 00-1 1v14a1 1 0 001 1z"/>
          </svg>
          <p class="text-gray-500 text-sm">Tap to add photos</p>
          <p class="text-gray-400 text-xs mt-1">JPG, PNG, HEIC up to 10MB each</p>
          <input id="photoInput" type="file" name="photos" accept="image/*" multiple class="hidden" />
        </div>
        <div id="photoPreview" class="photo-preview flex flex-wrap gap-2 mt-3"></div>
      </div>

      <!-- Submit -->
      <button type="submit" id="submitBtn"
        class="w-full bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold text-base rounded-xl py-3 transition-colors flex items-center justify-center gap-2">
        Send Report
      </button>

      <!-- Error message -->
      <p id="errorMsg" class="hidden text-red-500 text-sm text-center"></p>

    </form>

    <!-- Success screen (hidden by default) -->
    <div id="successScreen" class="hidden bg-white rounded-2xl shadow-md px-6 py-10 text-center">
      <div class="text-5xl mb-4">✅</div>
      <h2 class="text-xl font-bold text-gray-800 mb-2">Report Sent!</h2>
      <p class="text-gray-500 text-sm mb-6">Your daily report has been emailed to the project manager.</p>
      <button onclick="resetForm()" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition-colors">
        Submit Another Report
      </button>
    </div>

  </div>

  <script>
    // Set today's date as default
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('reportDate').value = today;

    // Live hours calculation
    function updateHours() {
      const s = document.getElementById('startTime').value;
      const e = document.getElementById('endTime').value;
      const badge = document.getElementById('hoursBadge');
      if (!s || !e) { badge.classList.add('hidden'); return; }
      const [sh, sm] = s.split(':').map(Number);
      const [eh, em] = e.split(':').map(Number);
      const diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) { badge.classList.add('hidden'); return; }
      const h = Math.floor(diff / 60), m = diff % 60;
      badge.textContent = `Total: ${h}h${m ? ' ' + m + 'm' : ''}`;
      badge.classList.remove('hidden');
    }
    document.getElementById('startTime').addEventListener('change', updateHours);
    document.getElementById('endTime').addEventListener('change', updateHours);

    // Photo preview
    const photoInput = document.getElementById('photoInput');
    const preview = document.getElementById('photoPreview');
    let selectedFiles = [];

    photoInput.addEventListener('change', (e) => {
      addFiles(Array.from(e.target.files));
    });

    function addFiles(files) {
      files.forEach(file => {
        if (selectedFiles.length >= 10) return;
        selectedFiles.push(file);
        const reader = new FileReader();
        reader.onload = (e) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'relative';
          wrapper.innerHTML = `
            <img src="${e.target.result}" alt="photo" />
            <button type="button" onclick="removePhoto(this, ${selectedFiles.length - 1})"
              class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center leading-none">×</button>
          `;
          preview.appendChild(wrapper);
        };
        reader.readAsDataURL(file);
      });
    }

    function removePhoto(btn, idx) {
      selectedFiles.splice(idx, 1);
      btn.parentElement.remove();
      // Re-index remaining remove buttons
      preview.querySelectorAll('button').forEach((b, i) => {
        b.setAttribute('onclick', `removePhoto(this, ${i})`);
      });
    }

    // Drag and drop
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      addFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
    });

    // Form submit
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.add('hidden');

      // Basic validation
      const required = ['workerName', 'jobSite', 'reportDate', 'startTime', 'endTime', 'description'];
      for (const name of required) {
        if (!form[name].value.trim()) {
          form[name].focus();
          showError('Please fill in all required fields.');
          return;
        }
      }

      const formData = new FormData(form);
      // Replace file input with selected files (handles our custom list)
      formData.delete('photos');
      selectedFiles.forEach(f => formData.append('photos', f));

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Sending…';

      try {
        const res = await fetch('/submit', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        document.getElementById('reportForm').classList.add('hidden');
        document.getElementById('successScreen').classList.remove('hidden');
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Send Report';
      }
    });

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('reportForm').reset();
      document.getElementById('reportDate').value = today;
      document.getElementById('hoursBadge').classList.add('hidden');
      document.getElementById('photoPreview').innerHTML = '';
      selectedFiles = [];
      document.getElementById('reportForm').classList.remove('hidden');
      document.getElementById('successScreen').classList.add('hidden');
      document.getElementById('errorMsg').classList.add('hidden');
    }
  </script>

</body>
</html>
